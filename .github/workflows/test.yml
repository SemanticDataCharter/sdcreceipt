name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    # dev is the persistent integration branch, so PRs land there first.
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip by hash (eMudhra/emSign CA compromise, October 2026)
        # Older pip vendors a certifi that trusts the compromised emSign root; fetch the fix from a pinned hash.
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # The conformance vectors are the point of this package, so they get their
  # own job. If it goes red, this tool no longer agrees with the published
  # specification, whatever the unit tests say.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Upgrade pip by hash (eMudhra/emSign CA compromise, October 2026)
        # Older pip vendors a certifi that trusts the compromised emSign root; fetch the fix from a pinned hash.
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Published conformance vectors
        run: pytest tests/test_conformance.py -v --tb=short

  # Known-vulnerable dependencies, checked on every push rather than when someone
  # remembers (Lee, 4.3.3 review: RA-5). The installed tree is what a verifier
  # actually runs, so that is what is audited, extras included.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Upgrade pip by hash (eMudhra/emSign CA compromise, October 2026)
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Install with every extra
        run: pip install ".[dev]" pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable

  # ★ Install the way a counterparty does: no extras, no dev environment.
  # The 4.0.0 release shipped a traceback on `--schema` because every test
  # ran somewhere jsonschema already happened to be installed.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Upgrade pip by hash (eMudhra/emSign CA compromise, October 2026)
        # Older pip vendors a certifi that trusts the compromised emSign root; fetch the fix from a pinned hash.
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Install with no extras
        run: pip install .
      - name: jsonschema must be absent, or this job proves nothing
        run: |
          if python -c "import jsonschema" 2>/dev/null; then
            echo "::error::jsonschema is installed; this job cannot detect the bug it exists for"
            exit 1
          fi
      - name: verify works without the optional extra
        run: |
          cd tests/conformance
          python - <<'PY'
          import json
          d = json.load(open("keys.json"))
          for name in ("issuer_keys", "party_keys"):
              doc = {"keys": [{"key_id": k, "public_key_pem": v} for k, v in d[name].items()]}
              json.dump(doc, open(f"{name}.json", "w"))
          PY
          sdcreceipt verify valid-settled.json --issuer-keys issuer_keys.json --party-keys party_keys.json
      - name: --schema reports the missing extra instead of a traceback
        run: |
          cd tests/conformance
          out=$(sdcreceipt verify valid-settled.json --issuer-keys issuer_keys.json --party-keys party_keys.json \
                  --schema settlement-receipt-1.0.schema.json 2>&1) && rc=0 || rc=$?
          echo "$out"
          if echo "$out" | grep -q "Traceback"; then
            echo "::error::a missing optional dependency produced a traceback"
            exit 1
          fi
          echo "$out" | grep -q "sdcreceipt\[schema\]" || {
            echo "::error::no actionable message about the missing extra"; exit 1; }

      # The example is the artifact that gets forwarded to a counterparty, so it
      # has to run on the install a counterparty actually performs. A walkthrough
      # that only works in the dev environment is worse than none: it fails in
      # front of the one person we were trying to convince.
      - name: The worked example runs on a bare install
        run: |
          out=$(python examples/settle.py) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "VERIFIED" || {
            echo "::error::examples/settle.py did not reach VERIFIED"; exit 1; }

      # Both interfaces ship in one package precisely so they cannot drift, and
      # the MCP server is the half no unit test would notice failing to launch.
      # The negative check is the load-bearing one: submit_trigger is omitted so
      # this server cannot reach the network, and that must stay true.
      - name: The MCP server starts, and still refuses to submit
        run: |
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | sdcreceipt-mcp)
          echo "$out"
          echo "$out" | grep -q '"verify_receipt"' || {
            echo "::error::verify_receipt was not advertised"; exit 1; }
          if echo "$out" | grep -q '"submit_trigger"'; then
            echo "::error::submit_trigger is exposed; this server must not reach the network"
            exit 1
          fi
